<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Múltiples Archivos a Google Drive</title>
    
    <!-- Enlace al manifiesto para la instalación como App (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4285F4">
    
    <!-- Icono para la pestaña y dispositivos móviles -->
    <link rel="icon" type="image/jpeg" href="logo marca de agua APK.jpg">
    <link rel="apple-touch-icon" href="logo marca de agua APK.jpg">

    <!-- FontAwesome para los iconos de iOS, Android y PC -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .upload-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-container img {
            max-width: 140px;
            height: auto;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
            text-align: center;
        }
        form {
            width: 100%;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px dashed #ccc;
            border-radius: 5px;
            background-color: #fafafa;
            box-sizing: border-box;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #357ae8;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            white-space: pre-line;
            width: 100%;
        }
        .loading {
            color: #e67e22;
        }
        .success {
            color: #27ae60;
        }
        .error {
            color: #c0392b;
        }
        .footer-container {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
        .compatibility {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="upload-card">
    
    <!-- LOGO SUPERIOR -->
    <div class="logo-container">
        <img src="logo biomax.png" alt="Logo Biomax">
    </div>

    <h2>Subir Archivos a Google Drive</h2>
    
    <form id="uploadForm">
        <div class="form-group">
            <label for="fileInput">Selecciona uno o varios archivos (PDF, Imágenes, etc.):</label>
            <input type="file" id="fileInput" accept=".pdf, image/*" multiple required>
        </div>
        <button type="submit" id="submitBtn">Subir Archivos</button>
    </form>
    
    <div id="status"></div>

    <!-- PIE DE PÁGINA -->
    <div class="footer-container">
        <p>&copy; 2026 Todos los derechos reservados. | <strong>Versión V 1.1510</strong></p>
        <div class="compatibility" title="Compatible con iOS, Android y PC/Web">
            <span>Compatible con:</span>
            <i class="fa-brands fa-apple" title="iOS"></i>
            <i class="fa-brands fa-android" title="Android"></i>
            <i class="fa-solid fa-desktop" title="PC / Escritorio"></i>
        </div>
    </div>

</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw0BgRpeykeOx2uy5oIsi7ORo65B4QzX6PDetU09a1MddMtaQ-ywPHS9qfHEYlYPM8k/exec"; // Pega aquí tu URL de Apps Script

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        
        if (fileInput.files.length === 0) {
            alert("Por favor selecciona al menos un archivo.");
            return;
        }
        
        statusDiv.className = "loading";
        statusDiv.innerText = `Subiendo ${fileInput.files.length} archivo(s), por favor espera...`;
        submitBtn.disabled = true;

        try {
            const readFileAsBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve({
                        fileName: file.name,
                        mimeType: file.type,
                        fileData: reader.result.split(',')[1]
                    });
                    reader.onerror = error => reject(error);
                });
            };

            const filePromises = Array.from(fileInput.files).map(file => readFileAsBase64(file));
            const filesArray = await Promise.all(filePromises);

            const payload = { files: filesArray };

            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            statusDiv.className = "success";
            statusDiv.innerText = `¡${fileInput.files.length} archivo(s) subido(s) con éxito a Google Drive!`;
            document.getElementById('uploadForm').reset();

        } catch (error) {
            console.error("Error:", error);
            statusDiv.className = "error";
            statusDiv.innerText = "Hubo un error al procesar los archivos.";
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
